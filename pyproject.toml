[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nnbox"
version = "0.2.0"
description = "Reusable PyTorch building blocks."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Samuel Barbeau", email = "samuelpbarbeau@gmail.com" }]
dependencies = [
    "torch>=2.4",  # nn.RMSNorm
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16,<0.17"]

[project.urls]
Repository = "https://github.com/samb271/nnbox"

[tool.hatch.build.targets.wheel]
packages = ["src/nnbox"]

[tool.ruff]
line-length = 100

# Pinned explicitly: ruff's default rule set widens between releases, so
# relying on it means the lint result drifts with whatever version happens to
# be installed. Paired with the bound on ruff in the dev extra.
[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # flake8-simplify
    "C4",      # comprehensions
    "PL",      # pylint
    "RUF",     # ruff-specific
]
ignore = [
    # Layer constructors are config-heavy by nature; PatchDecoder alone takes
    # 11 size knobs, and splitting them up would not make it clearer.
    "PLR0913",  # too many arguments
    "PLR0917",  # too many positional arguments
    "PLR2004",  # magic value in comparison — shape and size literals read fine
]

# pep8-naming (N) is deliberately absent: it fights the tensor-shape
# convention this package is written in (B, Tq, Tk, H, Dh) and the universal
# `import torch.nn.functional as F`.

[tool.pytest.ini_options]
testpaths = ["tests"]
