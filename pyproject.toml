[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nnbox"
version = "0.2.0"
description = "Reusable PyTorch building blocks."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Samuel Barbeau", email = "samuelpbarbeau@gmail.com" }]
dependencies = [
    "torch>=2.4",  # nn.RMSNorm
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16,<0.17"]

[project.urls]
Repository = "https://github.com/samb271/nnbox"

[tool.hatch.build.targets.wheel]
packages = ["src/nnbox"]

[tool.ruff]
line-length = 100

# Selected explicitly so the lint result does not drift with ruff's defaults,
# which is how E501 went unchecked despite line-length being set here. Kept to
# the families that stay silent until something is actually wrong — style-
# opinion rules (PL, RUF, N) fire on deliberate choices and cost more
# iteration time than they return on a library this size.
[tool.ruff.lint]
select = [
    "E",  # pycodestyle, incl. the E501 that line-length implies
    "F",  # pyflakes: undefined names, unused imports
    "B",  # bugbear: mutable defaults and similar footguns
    "I",  # import sorting
]

[tool.pytest.ini_options]
testpaths = ["tests"]
